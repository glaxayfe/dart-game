<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프로 다트 챔피언십</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; font-family: 'Pretendard', sans-serif; touch-action: none; user-select: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: white; font-size: 20px; font-weight: bold; pointer-events: auto; text-shadow: 1px 1px 3px black; }
        .wind-indicator { color: #00e5ff; font-size: 18px; margin-top: 5px; }
        
        .panel { background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(10px); padding: 25px; border-radius: 15px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8); pointer-events: auto; display: none; width: 85%; max-width: 380px; border: 1px solid rgba(255,255,255,0.1); }
        .panel h1 { margin-top: 0; color: #ffeb3b; text-transform: uppercase; font-style: italic; }
        .panel p { font-size: 15px; line-height: 1.5; color: #ccc; }
        
        button { background: #e94560; color: white; border: none; padding: 14px 20px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 12px; width: 100%; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        button.alt-btn { background: #0f3460; }
        
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; font-size: 16px; text-align: center; background: rgba(255,255,255,0.9); }
        
        .leaderboard-list { list-style: none; padding: 0; margin: 15px 0; text-align: left; max-height: 250px; overflow-y: auto; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; }
        .leaderboard-list li span:nth-child(2) { font-weight: bold; color: #ffeb3b; }
        
        #startPanel { display: block; }
        #message { position: absolute; top: 25%; color: #fff; font-size: 45px; font-weight: bold; opacity: 0; transition: opacity 0.3s; text-shadow: 2px 2px 10px #000; text-align: center; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="hud" id="hud" style="display:none;">
            <div>
                <div>점수: <span id="scoreDisplay" style="color:#ffeb3b; font-size: 24px;">0</span></div>
                <div class="wind-indicator">바람: <span id="windDisplay">0</span></div>
            </div>
            <div style="text-align: right;">
                <div>남은 다트</div>
                <div id="dartsLeft" style="font-size: 24px; color:#e94560;">5</div>
            </div>
        </div>

        <div id="message">Bullseye!</div>

        <!-- 시작 패널 -->
        <div class="panel" id="startPanel">
            <h1>PRO DARTS 🎯</h1>
            <p>
                <b>실제 다트 룰 적용! (2배수/3배수)</b><br>
                화면 하단에서 위로 <b>빠르게 스와이프</b>하세요.<br>
                바람(Wind)의 방향과 스와이프 속도에 따라<br>
                다트가 날아가는 궤적이 달라집니다.
            </p>
            <button onclick="startGame()">게임 시작</button>
            <button onclick="showLeaderboard()" class="alt-btn">🏆 실시간 랭킹 보기</button>
        </div>

        <!-- 게임 오버 패널 -->
        <div class="panel" id="gameOverPanel">
            <h1>게임 종료</h1>
            <p style="font-size: 20px;">최종 점수: <b id="finalScore" style="color: #ffeb3b; font-size: 30px;">0</b>점</p>
            <input type="text" id="playerName" placeholder="랭킹에 등록할 이름 (최대 10자)" maxlength="10">
            <button onclick="submitScore()" id="submitBtn">랭킹 등록하기</button>
            <button onclick="location.reload()" class="alt-btn" style="background: #444;">처음으로</button>
        </div>

        <!-- 리더보드 패널 -->
        <div class="panel" id="leaderboardPanel">
            <h1>전 세계 랭킹 TOP 10</h1>
            <ul class="leaderboard-list" id="leaderboardList">
                <li>로딩 중...</li>
            </ul>
            <button onclick="closeLeaderboard()" class="alt-btn">닫기</button>
        </div>
    </div>

<script>
    // 프로 버전용 새로운 DB 주소
    const DB_URL = "https://kvdb.io/2UcwGvTjYwXG38w8YkU2d3/pro_dart_ranking_v1";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0, darts = 5, isPlaying = false;
    let dartsThrown = [];
    let currentDart = null;
    let windX = 0, windY = 0;
    
    // 보드 위치 및 크기 (반응형)
    let boardX = canvas.width / 2;
    let boardY = canvas.height * 0.35;
    let boardRadius = Math.min(canvas.width, canvas.height) * 0.4;

    // 실제 다트판 점수 배열 (12시부터 시계방향)
    const sectors = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

    // 스와이프 물리엔진 변수
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startTime = 0;

    class Dart {
        constructor() {
            this.x = canvas.width / 2;
            this.y = canvas.height * 0.9;
            this.targetX = this.x;
            this.targetY = this.y;
            this.scale = 1;
            this.isFlying = false;
            this.landed = false;
        }
        flyTo(tx, ty) {
            this.targetX = tx;
            this.targetY = ty;
            this.isFlying = true;
        }
        update() {
            if (this.isFlying) {
                // 부드러운 이동 애니메이션
                this.x += (this.targetX - this.x) * 0.12;
                this.y += (this.targetY - this.y) * 0.12;
                this.scale -= 0.04; 
                
                if (this.scale <= 0.2) {
                    this.scale = 0.2;
                    this.isFlying = false;
                    this.landed = true;
                    // 완전히 도착했을 때 점수 계산
                    calculateScore(this.x, this.y);
                    setTimeout(nextDart, 1200);
                }
            }
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);
            
            // 날카로운 프로 다트 디자인
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.moveTo(0, -40); // 뾰족한 끝
            ctx.lineTo(8, 0);
            ctx.lineTo(-8, 0);
            ctx.fill();
            
            ctx.fillStyle = "#e94560"; // 깃
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(15, 30);
            ctx.lineTo(0, 45);
            ctx.lineTo(-15, 30);
            ctx.fill();
            ctx.restore();
        }
    }

    // 실제 다트판 그리기 함수
    function drawBoard() {
        // 배경 까만 테두리
        ctx.beginPath();
        ctx.arc(boardX, boardY, boardRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ccc";
        ctx.stroke();

        const anglePerSector = (Math.PI * 2) / 20;
        
        // 부채꼴 그리기
        for (let i = 0; i < 20; i++) {
            let startAngle = -Math.PI/2 + (i - 0.5) * anglePerSector;
            let endAngle = startAngle + anglePerSector;
            
            // 싱글 영역 (검정/흰색 교차)
            ctx.beginPath();
            ctx.moveTo(boardX, boardY);
            ctx.arc(boardX, boardY, boardRadius * 0.75, startAngle, endAngle);
            ctx.fillStyle = i % 2 === 0 ? "#111" : "#fff";
            ctx.fill();

            // 더블 링 (바깥쪽, 빨강/초록 교차)
            ctx.beginPath();
            ctx.arc(boardX, boardY, boardRadius * 0.75, startAngle, endAngle);
            ctx.arc(boardX, boardY, boardRadius * 0.7, endAngle, startAngle, true);
            ctx.fillStyle = i % 2 === 0 ? "#e94560" : "#4caf50";
            ctx.fill();

            // 트리플 링 (중간, 빨강/초록 교차)
            ctx.beginPath();
            ctx.arc(boardX, boardY, boardRadius * 0.45, startAngle, endAngle);
            ctx.arc(boardX, boardY, boardRadius * 0.4, endAngle, startAngle, true);
            ctx.fillStyle = i % 2 === 0 ? "#e94560" : "#4caf50";
            ctx.fill();

            // 숫자 그리기
            let textAngle = -Math.PI/2 + i * anglePerSector;
            let textX = boardX + Math.cos(textAngle) * boardRadius * 0.88;
            let textY = boardY + Math.sin(textAngle) * boardRadius * 0.88;
            ctx.fillStyle = "#fff";
            ctx.font = `bold ${boardRadius * 0.12}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(sectors[i], textX, textY);
        }

        // 아우터 불 (25점)
        ctx.beginPath();
        ctx.arc(boardX, boardY, boardRadius * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = "#4caf50";
        ctx.fill();

        // 이너 불 (50점)
        ctx.beginPath();
        ctx.arc(boardX, boardY, boardRadius * 0.05, 0, Math.PI * 2);
        ctx.fillStyle = "#e94560";
        ctx.fill();
    }

    // 수학적 점수 계산 (각도와 거리)
    function calculateScore(hitX, hitY) {
        let dx = hitX - boardX;
        let dy = hitY - boardY;
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        let msg = document.getElementById('message');
        let points = 0;
        let text = "Miss";

        if (dist > boardRadius * 0.75) {
            points = 0;
            text = "Miss!";
        } else if (dist < boardRadius * 0.05) {
            points = 50;
            text = "BULLSEYE!! (50)";
        } else if (dist < boardRadius * 0.1) {
            points = 25;
            text = "Outer Bull (25)";
        } else {
            // 각도 계산하여 어느 숫자에 맞았는지 판별
            let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90; // 12시 기준 0도
            if (angle < 0) angle += 360;
            angle = (angle + 9) % 360; // 경계선 정렬 (18도의 절반인 9도 쉬프트)
            let sectorIndex = Math.floor(angle / 18);
            let baseScore = sectors[sectorIndex];

            // 거리에 따른 배수 판별
            if (dist > boardRadius * 0.7 && dist < boardRadius * 0.75) {
                points = baseScore * 2;
                text = `Double ${baseScore}!!`;
            } else if (dist > boardRadius * 0.4 && dist < boardRadius * 0.45) {
                points = baseScore * 3;
                text = `Triple ${baseScore}!!!`;
            } else {
                points = baseScore;
                text = `${baseScore}`;
            }
        }

        score += points;
        document.getElementById('scoreDisplay').innerText = score;
        
        msg.innerText = text;
        msg.style.color = points >= 50 ? "#ffeb3b" : (points === 0 ? "#ff5252" : "#fff");
        msg.style.opacity = 1;
        setTimeout(() => msg.style.opacity = 0, 1500);
    }

    // 바람 세팅 (매 다트마다 바뀜)
    function setRandomWind() {
        windX = (Math.random() - 0.5) * 150; // -75 ~ 75
        windY = (Math.random() - 0.5) * 50;
        
        let direction = windX > 0 ? "▶" : "◀";
        let strength = Math.abs(Math.round(windX / 10));
        document.getElementById('windDisplay').innerText = strength === 0 ? "무풍" : `${direction} ${strength}`;
    }

    function nextDart() {
        if (darts > 1) {
            darts--;
            document.getElementById('dartsLeft').innerText = darts;
            dartsThrown.push(currentDart);
            currentDart = new Dart();
            setRandomWind();
        } else {
            isPlaying = false;
            document.getElementById('gameOverPanel').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 보드 중앙점 업데이트 (반응형 대응)
        boardX = canvas.width / 2;
        boardY = canvas.height * 0.35;
        boardRadius = Math.min(canvas.width, canvas.height) * 0.4;
        
        drawBoard();
        dartsThrown.forEach(d => d.draw());

        if (currentDart) {
            currentDart.update();
            currentDart.draw();
        }

        requestAnimationFrame(gameLoop);
    }

    // 스와이프 입력 처리 (속도 기반)
    function getClientPos(e) {
        return {
            x: e.touches ? e.touches[0].clientX : e.clientX,
            y: e.touches ? e.touches[0].clientY : e.clientY
        };
    }

    function startDrag(e) {
        if (!isPlaying || currentDart.isFlying || currentDart.landed) return;
        isDragging = true;
        let pos = getClientPos(e);
        dragStartX = pos.x;
        dragStartY = pos.y;
        startTime = Date.now();
    }

    function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        
        let pos = getClientPos(e.changedTouches ? e : e);
        let dx = pos.x - dragStartX;
        let dy = pos.y - dragStartY;
        let timeElapsed = Date.now() - startTime;
        
        // 위로 드래그(음수 dy)해야만 날아감
        if (dy > -20) return; 

        // 속도 계산 (빠르게 스와이프할수록 멀리 날아감)
        let speedY = Math.abs(dy) / timeElapsed;
        
        // 비거리(거리) 계산 - 너무 느리면 아래로 떨어짐
        let throwDistanceY = dy * (speedY * 1.5);
        let throwDistanceX = dx * (speedY * 1.5);

        // 도착 지점 = 현재 위치 + 드래그 비거리 + 바람의 영향
        let targetX = currentDart.x + throwDistanceX + windX;
        let targetY = currentDart.y + throwDistanceY + windY;

        currentDart.flyTo(targetX, targetY);
    }

    window.addEventListener('mousedown', startDrag);
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    function startGame() {
        document.getElementById('startPanel').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        score = 0; darts = 5; dartsThrown = [];
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('dartsLeft').innerText = darts;
        currentDart = new Dart();
        setRandomWind();
        isPlaying = true;
    }

    // --- 실시간 랭킹 (무료 DB API) ---
    async function showLeaderboard() {
        document.getElementById('startPanel').style.display = 'none';
        document.getElementById('gameOverPanel').style.display = 'none';
        document.getElementById('leaderboardPanel').style.display = 'block';
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "<li>불러오는 중...⏳</li>";
        
        try {
            let res = await fetch(DB_URL);
            let data = res.ok ? await res.json() : [];
            if (!Array.isArray(data)) data = [];
            
            list.innerHTML = "";
            if (data.length === 0) list.innerHTML = "<li>아직 랭킹이 없습니다. 1등에 도전하세요!</li>";
            
            // 점수 높은 순으로 정렬 후 상위 10명 표시
            data.sort((a, b) => b.score - a.score).slice(0, 10).forEach((entry, idx) => {
                let medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
                list.innerHTML += `<li><span>${medal} ${entry.name}</span> <span>${entry.score} pts</span></li>`;
            });
        } catch(e) {
            list.innerHTML = "<li>랭킹 서버에 연결할 수 없습니다.</li>";
        }
    }

    function closeLeaderboard() {
        document.getElementById('leaderboardPanel').style.display = 'none';
        if (!isPlaying && score === 0) {
            document.getElementById('startPanel').style.display = 'block';
        }
    }

    async function submitScore() {
        const name = document.getElementById('playerName').value.trim() || "익명";
        const btn = document.getElementById('submitBtn');
        btn.innerText = "등록 중...";
        btn.disabled = true;

        try {
            let res = await fetch(DB_URL);
            let data = res.ok ? await res.json() : [];
            if (!Array.isArray(data)) data = [];

            // 새 점수 추가 및 정렬
            data.push({ name: name, score: score });
            data.sort((a, b) => b.score - a.score);
            data = data.slice(0, 10); // 상위 10명만 유지

            // DB 업데이트
            await fetch(DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('gameOverPanel').style.display = 'none';
            showLeaderboard(); // 랭킹 보여주기
        } catch(e) {
            alert("통신 오류! 인터넷 연결을 확인해주세요.");
            btn.innerText = "랭킹 등록하기";
            btn.disabled = false;
        }
    }

    gameLoop();
</script>
</body>
</html>
